name: Refresh tonight's-game snapshot

# Bakes the current Yankees game + channel into index.html so crawlers and
# no-JS visitors get a real answer. Runs on a schedule and can be triggered
# by hand from the Actions tab.
on:
  schedule:
    # Every 3 hours (UTC). Covers pre-game, first pitch, and post-game windows
    # across the ET day. GitHub cron is best-effort and may run a few min late.
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

# contents: commit the regenerated index.html back to the repo.
# issues:   let the health check open an issue when something needs a human.
permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate snapshot
        run: node scripts/update-snapshot.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain index.html sitemap.xml)" ]]; then
            git config user.name  "snapshot-bot"
            git config user.email "actions@github.com"
            git add index.html sitemap.xml
            git commit -m "chore: refresh tonight's-game snapshot [skip ci]"
            git push
          else
            echo "No snapshot change to commit."
          fi

      # Watchdog: never writes files, never fails the job. Opens a GitHub
      # issue if a broadcaster is unrecognized, a snapshot marker has
      # drifted, JSON-LD stopped parsing, or the two copies of the channel
      # classifier have fallen out of lockstep.
      - name: Site health check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-health.mjs
